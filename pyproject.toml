[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aaajiao-scraper"
version = "6.6.0"
description = "AI-powered portfolio scraper for aaajiao's works with multi-modal extraction"
authors = [
    {name = "aaajiao Scraper Contributors"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.15"
keywords = ["scraper", "web-scraping", "ai", "firecrawl", "portfolio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
]

dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "tqdm>=4.66.0",
    "streamlit>=1.29.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    
    # Code Quality
    "ruff>=0.17.4",
    "black>=26.10.1",
    "mypy>=2.4.1",
    "isort>=5.12.0",
    
    # Type Stubs
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
    "pandas-stubs>=2.0.0",
]

async = [
    "aiohttp>=3.9.0",
    "asyncio>=3.4.3",
]

config = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.1.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/aaajiao/aaajiao_scraper"
Documentation = "https://github.com/aaajiao/aaajiao_scraper#readme"
Repository = "https://github.com/aaajiao/aaajiao_scraper"
Issues = "https://github.com/aaajiao/aaajiao_scraper/issues"

# ==================
# Tool Configurations
# ==================

[tool.setuptools.packages.find]
where = ["portfolio_scraper"]
include = ["scraper*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
scraper = ["py.typed"]

# Ruff configuration is maintained only in .ruff.toml.

# ==================
# Black Configuration
# ==================
[tool.black]
line-length = 100
target-version = ['py315']
extend-exclude = '''
/(
  | .cache
  | .venv
  | agent_discovery_output
)/
'''

# ==================
# MyPy Configuration
# ==================
[tool.mypy]
python_version = "3.15"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten over time
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "tqdm.*",
]
ignore_missing_imports = true

# ==================
# Pytest Configuration
# ==================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["portfolio_scraper/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=portfolio_scraper/scraper",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_network: marks tests that require network access",
    "requires_api_key: marks tests that require API key",
]

[tool.coverage.run]
source = ["portfolio_scraper/scraper"]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
